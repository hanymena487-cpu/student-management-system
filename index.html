<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة الطلاب - منه الله</title>
<style>
body{font-family:Arial;background:#f0f2f5;padding:20px;text-align:center}
h1{color:#1a73e8}
.box{background:white;padding:20px;border-radius:15px;max-width:600px;margin:auto;box-shadow:0 2px 10px #ccc}
input{padding:10px;margin:5px;width:90%;border:1px solid #ddd;border-radius:8px}
button{padding:10px 20px;background:#1a73e8;color:white;border:none;border-radius:8px;font-size:16px}
table{width:100%;margin-top:20px;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:10px}
th{background:#1a73e8;color:white}
.del{background:#ff4444;padding:5px 10px;font-size:13px}
</style>
</head>
<body>
<div class="box">
<h1>🎓 نظام إدارة الطلاب</h1>
<p>الطالبة: منه الله هاني شوقي عبده احمد</p>
<input id="name" placeholder="اسم الطالب">
<input id="grade" placeholder="الدرجة" type="number">
<br><br>
<button onclick="add()">إضافة طالب</button>
<table>
<tr><th>الاسم</th><th>الدرجة</th><th>التقدير</th><th>حذف</th></tr>
<tbody id="list"></tbody>
</table>
<p id="report"></p>
</div>
<script>
let students = JSON.parse(localStorage.getItem("students")) || [
{name:"أحمد",grade:90},
{name:"منة",grade:85},
{name:"عمر",grade:70},
{name:"منه الله هاني شوقي عبده احمد",grade:100}
];
function getGrade(g){
if(g>=90) return "ممتاز";
if(g>=80) return "جيد جدا";
if(g>=70) return "جيد";
if(g>=50) return "مقبول";
return "راسب";
}
function show(){
let list=document.getElementById("list");
list.innerHTML="";
let total=0;
students.forEach((s,i)=>{
total+=Number(s.grade);
let tr=document.createElement("tr");
tr.innerHTML="<td>"+s.name+"</td><td>"+s.grade+"</td><td>"+getGrade(s.grade)+"</td><td><button class='del' onclick='removeStudent("+i+")'>حذف</button></td>";
list.appendChild(tr);
});
let avg = students.length ? (total/students.length).toFixed(1) : 0;
document.getElementById("report").innerText="عدد الطلاب: "+students.length+" | المتوسط: "+avg;
localStorage.setItem("students", JSON.stringify(students));
}
function add(){
let n=document.getElementById("name").value;
let g=document.getElementById("grade").value;
if(!n||!g){alert("اكتبي الاسم والدرجة");return;}
students.push({name:n,grade:Number(g)});
document.getElementById("name").value="";
document.getElementById("grade").value="";
show();
}
function removeStudent(i){
students.splice(i,1);
show();
}
show();
</script>
</body>
</html>
