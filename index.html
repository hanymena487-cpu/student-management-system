<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة الطلاب</title>
<style>
body{font-family:Arial;background:#f0f2f5;padding:20px;text-align:center}
h1{color:#1a73e8}
.box{background:white;padding:20px;border-radius:15px;max-width:600px;margin:auto}
input{padding:10px;margin:5px;width:90%;border:1px solid #ddd;border-radius:8px}
button{padding:10px 20px;background:#1a73e8;color:white;border:none;border-radius:8px}
table{width:100%;margin-top:20px;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:10px}
th{background:#1a73e8;color:white}
</style>
</head>
<body>
<div class="box">
<h1>🎓 نظام إدارة الطلاب</h1>
<input id="name" placeholder="اسم الطالب">
<input id="grade" placeholder="الدرجة" type="number">
<br><br>
<button onclick="add()">إضافة طالب</button>
<table>
<tr><th>الاسم</th><th>الدرجة</th><th>التقدير</th></tr>
<tbody id="list">
<tr><td>أحمد</td><td>90</td><td>ممتاز</td></tr>
<tr><td>منة</td><td>85</td><td>جيد جدا</td></tr>
<tr><td>عمر</td><td>70</td><td>جيد</td></tr>
</tbody>
</table>
<p id="report"></p>
</div>
<script>
function getGrade(g){
if(g>=90) return "ممتاز";
if(g>=80) return "جيد جدا";
if(g>=70) return "جيد";
if(g>=50) return "مقبول";
return "راسب";
}
function add(){
let n=document.getElementById("name").value;
let g=document.getElementById("grade").value;
if(!n||!g){alert("اكتبي الاسم والدرجة");return;}
let tr=document.createElement("tr");
tr.innerHTML="<td>"+n+"</td><td>"+g+"</td><td>"+getGrade(g)+"</td>";
document.getElementById("list").appendChild(tr);
document.getElementById("name").value="";
document.getElementById("grade").value="";
}
let total=90+85+70;
document.getElementById("report").innerText="عدد الطلاب: 3 | المتوسط: "+(total/3).toFixed(1);
</script>
</body>
</html>
